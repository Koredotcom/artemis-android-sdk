plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Only the sample application consumes these values; local properties are never committed.
def sampleRuntimeProperties = new Properties()
def sampleRuntimeFile = rootProject.file('sample-runtime.local.properties')
if (sampleRuntimeFile.isFile()) {
    sampleRuntimeFile.withInputStream { sampleRuntimeProperties.load(it) }
}
def sampleRuntimeValue = { String key, String fallback ->
    System.getenv("ARTEMIS_SAMPLE_${key}") ?: sampleRuntimeProperties.getProperty(key, fallback)
}

android {
    buildFeatures { buildConfig = true }
    namespace 'com.artemis.uisdk.sample'
    compileSdk 36

    defaultConfig {
        applicationId 'com.artemis.uisdk.sample'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
        // CHANNEL_SECRET switches the sample to hosted bootstrap via /api/v1/sdk/customer-sessions.
        [ENDPOINT: '', PROJECT_ID: '', API_KEY: '', CHANNEL_ID: '', CHANNEL_NAME: '', CHAT_TITLE: 'Support',
         TENANT_ID: '', CHANNEL_SECRET: '', VERIFIED_USER_ID: '', CUSTOM_ATTRIBUTES_JSON: ''].each { key, fallback ->
            buildConfigField 'String', "ARTEMIS_SAMPLE_${key}", groovy.json.JsonOutput.toJson(sampleRuntimeValue(key, fallback))
        }
    }

    testOptions { unitTests.includeAndroidResources = true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        // Lifecycle 2.9's detector is incompatible with AGP 8.7's Kotlin analysis API.
        disable 'NullSafeMutableLiveData'
    }
}

dependencies {
    implementation project(':artemis_ui_sdk')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    // Build the local SDK so the sample exercises the changes under development.
}
