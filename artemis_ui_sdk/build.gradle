plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

group = 'com.artemis'
version = rootProject.ext.sdkReleaseVersion

android {
    namespace 'com.artemis.uisdk'
    compileSdk 36
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    testOptions { unitTests.includeAndroidResources = true }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    publishing {
        singleVariant('release') { withSourcesJar() }
    }

    lint {
        // Lifecycle 2.9's detector is incompatible with AGP 8.7's Kotlin analysis API.
        // This SDK uses StateFlow and does not use MutableLiveData.
        disable 'NullSafeMutableLiveData'
    }
}

dependencies {
    api 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    api 'androidx.fragment:fragment-ktx:1.8.8'
    api 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.12.0'
    api 'com.google.code.gson:gson:2.10.1'
    implementation 'org.yaml:snakeyaml:2.2'
    api project(':artemis_socket_sdk')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.artemis'
                artifactId = 'ui'
                version = project.version
            }
        }
    }
}
